<div class="asset-browser">

  <h3>Asset Browser</h3>

  <div class="tree">

    <app-tree-node
      *ngFor="let node of tree()"
      [node]="node"
      (assetSelected)="selectAsset($event)">
    </app-tree-node>

  </div>

  <div class="panel-splitter" [class.dragging]="dragging()" (pointerdown)="startResize($event)"
    title="Drag to resize the property panel"></div>

  <app-property-panel [style.height.px]="panelHeight()"></app-property-panel>

</div>
